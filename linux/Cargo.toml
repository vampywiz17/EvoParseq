[package]
name = "evoparseq-linux"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
ash = "0.38"
lowlat-decode = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
evoparseq-bud = { path = "../src-native/crates/bud" }
pipewire = { version = "=0.8.0", features = ["v0_3_49"] }
libopus_sys = { version = "=0.3.3", features = ["bundled", "static"] }
rtrb = "=0.4.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webrtc = "=0.14.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wayland", "wgpu"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan"] }
zeroize = "1"

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
dtls = { path = "../src-native/vendor/dtls-0.13.0" }
webrtc = { path = "../src-native/vendor/webrtc-0.14.0" }
webrtc-ice = { path = "../src-native/vendor/webrtc-ice-0.14.0" }
turn = { path = "../src-native/vendor/turn-0.11.0" }
[patch."https://github.com/nomi-san/lowlat"]
lowlat-core = { path = "../src-native/crates/bud/vendor/lowlat-core" }
lowlat-crypto = { path = "../src-native/crates/bud/vendor/lowlat-crypto" }

lowlat-drivers = { path = "../src-native/vendor/lowlat-drivers" }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
