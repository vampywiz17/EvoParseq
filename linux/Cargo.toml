[package]
name = "evoparseq-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
ash = "0.38"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wayland", "wgpu"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan"] }
zeroize = "1"

[profile.release]
strip = true
lto = "thin"
