sonar.projectKey=vampywiz17_EvoParseq
sonar.organization=vampywiz17

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Do not count third-party Lowlat drivers as duplicated code
sonar.cpd.exclusions=**/vendor/lowlat-drivers/**

# GitHub-hosted runners cannot exercise NVIDIA NGX on an RTX GPU: the VSR
# D3D11 adapter, consent-gated vendor downloader, signed release/update flow,
# and separately linked proprietary bridge are not eligible for meaningful
# end-to-end *line coverage* here. The offline manifest signer also requires
# an operator-held private key (never supplied to CI).
# Keep all these files in sonar.sources so security/reliability/maintainability
# rules still inspect them. Rust signature, digest, cache isolation, migration,
# and concurrency unit tests remain mandatory in native CI; they do not prove
# full remote release/update or live RTX evaluation.
# The project's new-code coverage threshold remains at 80% (unchanged).
sonar.coverage.exclusions=src-native/src/nvidia_vsr.rs,src-native/src/vsr_runtime.rs,src-native/src/vsr_bridge_update.rs,src-native/ngx-bridge/**,scripts/ngx-bridge-manifest.py
