sonar.projectKey=vampywiz17_EvoParseq
sonar.organization=vampywiz17

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Do not count third-party Lowlat drivers as duplicated code
sonar.cpd.exclusions=**/vendor/lowlat-drivers/**

# GitHub-hosted runners cannot exercise NVIDIA NGX on an RTX GPU: the VSR
# D3D11 adapter, consent-gated vendor downloader and separately linked
# proprietary bridge are not eligible for meaningful *line coverage* there.
# Keep them in sonar.sources for all security/reliability/maintainability scans.
# Offline checksum, size and tampering checks are unit-tested in vsr_runtime.rs;
# a physical RTX VSR playback/reconnect test remains required before merge.
# The project's new-code coverage threshold remains at 80%.
sonar.coverage.exclusions=src-native/src/nvidia_vsr.rs,src-native/src/vsr_runtime.rs,src-native/ngx-bridge/**
