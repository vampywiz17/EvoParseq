name: VirusTotal upload endpoint diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read one-time upload endpoint metadata
        env:
          VIRUSTOTAL: ${{ secrets.VIRUSTOTAL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class DenyRedirects(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          request = Request("https://www.virustotal.com/api/v3/files/upload_url",
                            headers={"x-apikey": os.environ["VIRUSTOTAL"]})
          try:
              with build_opener(DenyRedirects()).open(request, timeout=20) as reply:
                  endpoint = urlsplit(json.load(reply)["data"])
              authority = endpoint.username or endpoint.password or endpoint.port not in (None, 443)
          except Exception:
              raise SystemExit("Could not read the VirusTotal endpoint metadata")
          hostname = endpoint.hostname or ""
          provider = re.fullmatch(
              r"(?:[a-z0-9-]+\.)*(?:virustotal\.com|appspot\.com|googleapis\.com|googleusercontent\.com)",
              hostname)
          print("scheme:", endpoint.scheme if endpoint.scheme in ("http", "https") else "other")
          print("host:", hostname if provider else "other")
          print("standard upload path:", endpoint.path.startswith("/_ah/upload/"))
          print("nonstandard authority:", bool(authority))
          print("query present:", bool(endpoint.query))
          print("fragment present:", bool(endpoint.fragment))
          PY
