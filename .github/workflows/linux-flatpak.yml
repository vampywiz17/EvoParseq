name: EvoParseq Linux Flatpak

on:
  workflow_dispatch:
    inputs:
      comparison_run:
        description: Optional original Flatpak CI run ID for offline comparison
        type: string
        default: ''
      comparison_bundle_sha256:
        description: Expected original Flatpak SHA-256 (required with comparison_run)
        type: string
        default: ''
      comparison_elf_sha256:
        description: Expected original ELF SHA-256 (required with comparison_run)
        type: string
        default: ''
  pull_request:
    branches: [dev]
    paths: ['ci-tests/wayland-input/**', 'linux/**', '.github/workflows/linux-flatpak.yml', 'src-native/**', 'assets/evoparseq.svg', 'assets/evoparseq.png']
  push:
    branches: [main, dev]
    paths: ['ci-tests/wayland-input/**', 'linux/**', '.github/workflows/linux-flatpak.yml', 'src-native/**', 'assets/evoparseq.svg', 'assets/evoparseq.png']

permissions:
  contents: read

concurrency:
  group: linux-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-wayland-input:
    name: Native GNOME 46 input lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install disposable native compositor fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mutter adwaita-icon-theme python3-gi dbus-daemon libwayland-dev libxkbcommon-dev libgl1-mesa-dri
      - name: Compile production Wayland adapter in isolated fixture
        run: |
          cargo build --manifest-path ci-tests/wayland-input/Cargo.toml --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Exercise native cross-window drag without pointer warping or capture
        run: |
          timeout 90s dbus-run-session -- bash ci-tests/wayland-input/run.sh "$PWD/ci-tests/wayland-input/target/$(rustc -vV | sed -n 's/^host: //p')/debug/evoparseq-wayland-input-fixture"
  flatpak:
    needs: native-wayland-input
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Prepare locked offline sources
        run: |
          stage="$RUNNER_TEMP/linux-flatpak-src"
          mkdir -p "$stage"
          git archive HEAD linux .cargo assets/evoparseq.svg assets/evoparseq.png LICENSE src-native | tar -x -C "$stage"
          cd "$stage"
          rustfmt --edition 2024 --config skip_children=true --check linux/src/telemetry.rs linux/src/resources_linux.rs linux/src/secure_storage.rs linux/src/settings_linux.rs linux/src/main.rs linux/src/multi_display.rs linux/src/display_routes.rs linux/src/launcher.rs linux/src/desktop_linux.rs linux/src/native_loop.rs linux/src/session_overlay.rs linux/src/desktop_ui.rs linux/src/information_linux.rs linux/src/window_mode.rs linux/src/cursor_theme.rs linux/src/video_probe.rs linux/src/connection.rs linux/src/network_tests.rs linux/src/video_profile.rs linux/src/audio_pipewire.rs linux/src/audio_device.rs linux/src/gamepad_linux.rs linux/src/wayland_keys.rs linux/src/wayland_drag.rs linux/src/playback.rs linux/src/video_vulkan/*.rs linux/tests/video_contract.rs
          cargo vendor --manifest-path linux/Cargo.toml --locked --versioned-dirs vendor > .cargo/config.toml
      - name: Install Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common binutils
          dpkg --compare-versions "$(flatpak --version | cut -d ' ' -f 2)" ge 1.15.6
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm21//25.08
      - name: Build and bundle
        working-directory: ${{ runner.temp }}/linux-flatpak-src
        run: |
          flatpak-builder --user --force-clean --repo="$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/flatpak-build" linux/flatpak/io.github.vampywiz17.EvoParseq.yml
          test -s "$RUNNER_TEMP/flatpak-build/files/share/icons/Adwaita/cursors/default"
          test -s "$RUNNER_TEMP/flatpak-build/files/share/icons/Adwaita/cursors/text"
          test -s "$RUNNER_TEMP/flatpak-build/files/share/icons/Adwaita/cursors/ew-resize"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo "$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/EvoParseq-Linux.flatpak" io.github.vampywiz17.EvoParseq
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' linux/Cargo.toml | head -n1)
          mv "$RUNNER_TEMP/EvoParseq-Linux.flatpak" "$RUNNER_TEMP/EvoParseq-Linux-v${version}-x86_64.flatpak"
      - name: Compare with the exact original CI artifact without executing it
        if: github.event_name == 'workflow_dispatch' && inputs.comparison_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.comparison_run }}
          BASELINE_BUNDLE_SHA256: ${{ inputs.comparison_bundle_sha256 }}
          BASELINE_ELF_SHA256: ${{ inputs.comparison_elf_sha256 }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]]
          baseline_source=$(gh run view "$BASELINE_RUN" --json headSha --jq .headSha)
          [[ "$baseline_source" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$baseline_source"
          # Diagnostic code may differ, but every staged build-source path must match.
          git diff --exit-code "$baseline_source" HEAD -- linux .cargo assets/evoparseq.svg assets/evoparseq.png LICENSE src-native
          gh run download "$BASELINE_RUN" --name EvoParseq-Linux-Flatpak --dir "$RUNNER_TEMP/original-flatpak"
          python3 -m unittest discover -s ci-tests -p test_release_security_scan.py
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_security_scan import compare_flatpak_builds
          root = Path(os.environ['RUNNER_TEMP'])
          original, = (root / 'original-flatpak').glob('*.flatpak')
          rebuilt, = root.glob('EvoParseq-Linux-v*-x86_64.flatpak')
          report = compare_flatpak_builds(original, rebuilt, root / 'flatpak-comparison',
                                         os.environ['BASELINE_BUNDLE_SHA256'], os.environ['BASELINE_ELF_SHA256'])
          print(report)
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/flatpak-comparison/source.txt"
          printf '%s\n' "$baseline_source" > "$RUNNER_TEMP/flatpak-comparison/baseline-source.txt"
          flatpak info --user org.freedesktop.Sdk//25.08 > "$RUNNER_TEMP/flatpak-comparison/sdk.txt"
          flatpak info --user org.freedesktop.Sdk.Extension.rust-stable//25.08 > "$RUNNER_TEMP/flatpak-comparison/rust-sdk.txt"
      - name: Preserve offline comparison evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.comparison_run != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvoParseq-Linux-Offline-Comparison
          path: ${{ runner.temp }}/flatpak-comparison/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvoParseq-Linux-Flatpak
          path: ${{ runner.temp }}/EvoParseq-Linux-v*-x86_64.flatpak
          if-no-files-found: error
