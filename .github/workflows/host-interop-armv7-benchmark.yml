name: Phaze ARMv7 benchmark
on:
  workflow_dispatch:
  push:
    branches: [codex/phaze-protocol]
    paths: ['ci-tests/host-interop-armv7/**', '.github/workflows/host-interop-armv7-benchmark.yml', 'android-tv/native/patches/**', 'android-tv/native/prepare-purecrypto.sh']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Install ARMv7 compiler and emulator
        timeout-minutes: 7
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=1 update -qq
          sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Prepare pinned Phaze DTLS dependency
        run: bash android-tv/native/prepare-purecrypto.sh
      - name: Compare DTLS and standards-compatible AES-GCM on emulated Cortex-A7
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        working-directory: ci-tests/host-interop-armv7
        run: |
          set -o pipefail
          cargo build --locked --release --target armv7-unknown-linux-gnueabihf
          echo "Upstream DTLS AES-GCM" | tee -a "$GITHUB_STEP_SUMMARY"
          qemu-arm -cpu cortex-a7 -L /usr/arm-linux-gnueabihf target/armv7-unknown-linux-gnueabihf/release/evoparseq-host-interop-armv7 | tee -a "$GITHUB_STEP_SUMMARY"
          cargo build --locked --release --target armv7-unknown-linux-gnueabihf --features patched
          echo "DTLS with RustCrypto AES-GCM" | tee -a "$GITHUB_STEP_SUMMARY"
          qemu-arm -cpu cortex-a7 -L /usr/arm-linux-gnueabihf target/armv7-unknown-linux-gnueabihf/release/evoparseq-host-interop-armv7 | tee -a "$GITHUB_STEP_SUMMARY"
