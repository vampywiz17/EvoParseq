name: EvoParseq Android TV preview

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml', 'src-native/src/**', 'src-native/vendor/**', 'src-native/crates/bud/**', 'src-native/crates/phaze/**']
  pull_request:
    branches: [dev]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml', 'src-native/src/**', 'src-native/vendor/**', 'src-native/crates/bud/**', 'src-native/crates/phaze/**']

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-tv/native
      - name: Prepare pinned Phaze DTLS dependency
        run: bash android-tv/native/prepare-purecrypto.sh
      - name: Verify shared Rust account and streaming core
        run: |
          # Check edited Parsec-related files only. Cargo fmt also walks
          # pre-existing, unrelated Phaze modules through shared #[path] includes.
          rustfmt --edition 2024 --check android-tv/native/src/preferences.rs src-native/src/session_preferences.rs
          cargo test --locked --manifest-path android-tv/native/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path src-native/crates/bud/Cargo.toml -p evoparseq-bud --target x86_64-unknown-linux-gnu
          cargo clippy --locked --manifest-path android-tv/native/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - name: Prepare Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build ARM64 and ARMv7 Rust adapters
        working-directory: android-tv/native
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "$RUNNER_TEMP/opus-$abi"
            export CMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/opus-$abi/android.toolchain.cmake"
            printf 'set(ANDROID_ABI "%s" CACHE STRING "")\nset(ANDROID_PLATFORM android-29 CACHE STRING "")\ninclude("%s/build/cmake/android.toolchain.cmake")\n' "$abi" "$ANDROID_NDK_HOME" > "$CMAKE_TOOLCHAIN_FILE"
            cargo ndk -t "$abi" --platform 29 -o ../app/src/main/jniLibs build --locked --release
            cargo ndk -t "$abi" --platform 29 clippy --locked -- -D warnings
            # API-32 mask functions must remain optional runtime lookups. A strong
            # import would prevent loading the whole core on API 29-31.
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --dyn-syms --wide "../app/src/main/jniLibs/$abi/libevoparseq_tv.so" > "$RUNNER_TEMP/audio-symbols-$abi.txt"
            if grep -E 'UND.*AAudioStream(Builder_setChannelMask|_getChannelMask)' "$RUNNER_TEMP/audio-symbols-$abi.txt"; then
              echo 'New AAudio API was linked strongly; older Android loading would fail'
              exit 1
            fi
          done
      - name: Restore protected release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" || { echo 'Android release signing secrets are required'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/evoparseq-tv.p12"
          keytool -list -keystore "$RUNNER_TEMP/evoparseq-tv.p12" -storetype PKCS12 -storepass:env PASSWORD -alias evoparseq-tv > /dev/null
      - name: Build and lint TV application
        if: github.event_name != 'pull_request'
        working-directory: android-tv
        env:
          ANDROID_TV_KEYSTORE: ${{ runner.temp }}/evoparseq-tv.p12
          ANDROID_TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Build and lint isolated PR debug APK without release keys
        if: github.event_name == 'pull_request'
        working-directory: android-tv
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-tv/app/build/outputs/apk/release/app-release.apk'
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/evoparseq-tv.p12"
      - name: Describe preview artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist/android-tv
          cp android-tv/app/build/outputs/apk/release/app-release.apk dist/android-tv/EvoParseq-TV.apk
          cp android-tv/README.md LICENSE dist/android-tv/
          cp src-native/vendor/webrtc-0.14.0/LICENSE-MIT dist/android-tv/WEBRTC-LICENSE-MIT.txt
          cp src-native/vendor/webrtc-0.14.0/LICENSE-APACHE dist/android-tv/WEBRTC-LICENSE-APACHE.txt
          cp src-native/vendor/webrtc-util-0.12.0/LICENSE-MIT dist/android-tv/WEBRTC-UTIL-LICENSE-MIT.txt
          cp src-native/vendor/webrtc-util-0.12.0/LICENSE-APACHE dist/android-tv/WEBRTC-UTIL-LICENSE-APACHE.txt
          cp src-native/vendor/webrtc-0.14.0/LOCAL-CHANGES.md dist/android-tv/WEBRTC-LOCAL-CHANGES.md
          cp src-native/vendor/dtls-0.13.0/LICENSE-MIT dist/android-tv/DTLS-LICENSE-MIT.txt
          cp src-native/vendor/dtls-0.13.0/LICENSE-APACHE dist/android-tv/DTLS-LICENSE-APACHE.txt
          cp src-native/vendor/webrtc-util-0.12.0/LOCAL-CHANGES.md dist/android-tv/WEBRTC-UTIL-LOCAL-CHANGES.md
          cp src-native/vendor/dtls-0.13.0/EVOPARSEQ.md dist/android-tv/DTLS-LOCAL-CHANGES.md
          cp src-native/vendor/webrtc-ice-0.14.0/LOCAL-CHANGES.md dist/android-tv/ICE-LOCAL-CHANGES.md
          cp src-native/vendor/turn-0.11.0/LOCAL-CHANGES.md dist/android-tv/TURN-LOCAL-CHANGES.md
          for opus in "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/libopus_sys-0.3.3; do
            if [ -f "$opus/LICENSE" ]; then
              cp "$opus/LICENSE" dist/android-tv/LIBOPUS-SYS-LICENSE.txt
              cp "$opus/opus/COPYING" dist/android-tv/OPUS-LICENSE.txt
            fi
          done
          test -s dist/android-tv/OPUS-LICENSE.txt
          for symphonia in "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/symphonia-core-0.6.1; do
            if [ -f "$symphonia/LICENSE" ]; then
              cp "$symphonia/LICENSE" dist/android-tv/SYMPHONIA-MPL-2.0.txt
            fi
          done
          test -s dist/android-tv/SYMPHONIA-MPL-2.0.txt
          cp src-native/crates/phaze/SYMPHONIA-NOTICE.txt dist/android-tv/
          mkdir -p dist/android-tv/phaze-crypto-licenses
          cp android-tv/native/vendor/purecrypto-0.10.4/LICENSE dist/android-tv/phaze-crypto-licenses/PURECRYPTO-MIT.txt
          for package in aes-gcm-0.10.3 aes-0.8.4 ghash-0.5.1 polyval-0.6.2; do
            for source in "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/"$package"; do
              if [ -f "$source/LICENSE-MIT" ]; then
                cp "$source/LICENSE-MIT" "dist/android-tv/phaze-crypto-licenses/$package-MIT.txt"
                break
              fi
            done
            test -s "dist/android-tv/phaze-crypto-licenses/$package-MIT.txt"
          done
          cp src-native/crates/bud/vendor/lowlat-client/LICENSE dist/android-tv/LOWLAT-LICENSE.txt
          git rev-parse HEAD > dist/android-tv/SOURCE.txt
          sha256sum dist/android-tv/EvoParseq-TV.apk > dist/android-tv/SHA256.txt
          cp android-tv/app/build/reports/lint-results-release.html dist/android-tv/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: EvoParseq-Android-TV-preview
          path: dist/android-tv/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: EvoParseq-Android-TV-PR-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
